name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: "1.88"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        if: runner.os == 'Linux'
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        shell: bash
        env:
          RUST: ${{ matrix.rust }}
        run: |
          rustup toolchain install "$RUST" --profile minimal --component clippy,rustfmt
          rustup default "$RUST"
      - name: rustfmt
        if: matrix.rust == 'stable'
        run: cargo fmt --check
      - name: clippy
        if: matrix.rust == 'stable'
        run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Run on the examples
        shell: bash
        run: cargo run --locked -- agenda --from 2026-11-23 --days 7 --tz America/Vancouver examples/*.ics
